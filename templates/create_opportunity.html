<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Opportunity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { background: #f6f9fd; }
    .card-eva {
      background: white;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #dbe4f0;
    }
  </style>
</head>

<body>
<nav class="navbar navbar-dark" style="background:#082654;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">← Back</a> 
  </div>
</nav>


<div class="container mt-4">
  <div class="card-eva">
    <h4>Create Opportunity</h4>

    <form id="oppForm">
      <div class="mb-2">
        <label><strong>Opportunity Name</strong></label>
        <input type="text" name="name" class="form-control" required>
      </div>

      <div class="mb-2">
        <label><strong>Client Name</strong></label>
        <input type="text" name="client" class="form-control" required>
      </div>

      <div class="mb-2">
        <label><strong>Industry</strong></label>
        <input type="text" name="industry" class="form-control" required>
      </div>

      <div class="mb-2">
        <label><strong>Deal Value</strong></label>
        <input type="text" name="value" class="form-control" placeholder="$500K">
      </div>

      <div class="mb-2">
        <label><strong>Stage</strong></label>
        <select name="stage" class="form-select">
          <option>Discovery</option>
          <option>Qualifying</option>
          <option>Proposal</option>
          <option>Negotiation</option>
        </select>
      </div>

      <div class="mb-2">
        <label><strong>Description</strong></label>
        <textarea name="description" class="form-control"></textarea>
      </div>

      <div class="mb-2">
        <label><strong>Requirements</strong> (one per line)</label>
        <textarea name="requirements" class="form-control" rows="4"></textarea>
      </div>

      <button type="button" onclick="saveOpportunity()" class="btn btn-primary w-100 mt-2">
        Save Opportunity
      </button>

    </form>

  </div>
</div>

<script>
async function saveOpportunity() {
  const form = document.getElementById("oppForm");
  const formData = new FormData(form);

  const payload = {
    name: formData.get("name"),
    client: formData.get("client"),
    industry: formData.get("industry"),
    value: formData.get("value"),
    stage: formData.get("stage"),
    description: formData.get("description"),
    requirements: formData.get("requirements")
  };

  const res = await fetch("/api/create_opportunity", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  alert("Opportunity Created Successfully!");
  window.location.href = "/";   // Redirect to dashboard
}
</script>

</body>
</html>
