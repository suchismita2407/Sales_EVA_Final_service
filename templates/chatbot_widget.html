<style>
#chatWidget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 350px;
  height: 450px;
  border-radius: 12px;
  background: white;
  box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
  overflow: hidden;
}

#chatHeader {
  background: #082654;
  color: white;
  padding: 8px;
  font-weight: bold;
  border-radius: 12px 12px 0 0;
}

#chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  font-size: 14px;
}

/* INPUT */
#chatInputArea {
  display: flex;
  flex-direction: column;
  border-top: 1px solid #ddd;
}

#warningBox {
  background: #ffe4e4;
  color: #b40000;
  padding: 6px;
  font-size: 12px;
  display: none;
  border-top: 1px solid #dc0000;
}

#chatInputAreaInner {
  display: flex;
}

#chatInputArea input {
  flex: 1;
  border: none;
  padding: 8px;
}

#chatInputArea button {
  border: none;
  width: 60px;
  background: #082654;
  color: white;
}

/* BUBBLES */
.msg-container {
  display: flex;
  flex-direction: column;
}

.msg-container.you { align-items: flex-end; }

.msg-container.bot { align-items: flex-start; }

.user-msg {
  background: #DCF8C6;
  padding: 8px 12px;
  margin: 6px;
  border-radius: 12px;
  width: fit-content;
  max-width: 85%;
  font-size: 14px;
}

.bot-msg {
  background: #F1F1F1;
  padding: 8px 12px;
  margin: 6px;
  border-radius: 12px;
  border-left: 4px solid #082654;
  width: fit-content;
  max-width: 85%;
  font-size: 14px;
  white-space: pre-wrap;
}
</style>


<div id="chatWidget">
  <div id="chatHeader">
    EVA Assistant
    <span onclick="toggleChat()" style="float:right;cursor:pointer;">✖</span>
  </div>

  <div id="chatMessages"></div>

  <div id="warningBox"></div>

  <div id="chatInputArea">
    <div id="chatInputAreaInner">
      <input id="chatInput" placeholder="Ask anything..." />
      <button onclick="sendChat()" id="sendBtn">Send</button>
    </div>
  </div>
</div>


<button onclick="toggleChat()" style="
  position:fixed; bottom:20px;right:20px;
  border-radius:50%;
  width:60px;height:60px;
  border:none;background:#082654;color:white;font-size:22px;">
💬
</button>


<script>

// ❌ PII Validation check
function hasSensitiveData(input) {
  let patterns = [
    /\b\d{10}\b/,             // phone number
    /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i, // email
    /\b\d{12}\b/,             // Aadhaar
    /\b[A-Z]{5}\d{4}[A-Z]\b/, // PAN
    /\b\d{16}\b/,             // credit card
    /(password|otp|ssn|cvv)/i
  ];

  return patterns.some(p => p.test(input));
}

// ❌ Prompt Injection Check
function hasInjection(input){
  return /(ignore|drop table|shutdown|sudo|bypass|execute)/i.test(input);
}

function showWarning(msg) {
  let w = document.getElementById("warningBox");
  w.style.display = "block";
  w.innerText = msg;
  document.getElementById("sendBtn").disabled = true;
}

function clearWarning(){
  let w = document.getElementById("warningBox");
  w.style.display = "none";
  document.getElementById("sendBtn").disabled = false;
}

function sanitizeDisplay(text) {
  const temp = document.createElement("div");
  temp.innerHTML = text;

  // Remove dangerous tags
  const scripts = temp.querySelectorAll("script");
  scripts.forEach(s => s.remove());

  const iframes = temp.querySelectorAll("iframe");
  iframes.forEach(i => i.remove());

  return temp.innerHTML;
}


function loadChatHistory(){
  const saved = sessionStorage.getItem("eva_chat_history");
  if(saved){
    document.getElementById("chatMessages").innerHTML = saved;
  }
}

function scrollDown(){
  const chat=document.getElementById("chatMessages");
  chat.scrollTop = chat.scrollHeight;
}

function toggleChat(){
  const box=document.getElementById("chatWidget");
  if(box.style.display==="flex"){
    box.style.display="none";
  } else {
    box.style.display="flex";
    loadChatHistory();
    scrollDown();
  }
}

function persistChat(){
  sessionStorage.setItem(
    "eva_chat_history",
    document.getElementById("chatMessages").innerHTML
  );
}

function addMessage(text, sender){
  text = sanitizeDisplay(text);

  const chat = document.getElementById("chatMessages");

  const wrapper = document.createElement("div");
  wrapper.className = sender === "You" ? "msg-container you" : "msg-container bot";

  const bubble = document.createElement("div");
  bubble.className = sender === "You" ? "user-msg" : "bot-msg";

  bubble.innerHTML = text;

  wrapper.appendChild(bubble);
  chat.appendChild(wrapper);

  persistChat();
  scrollDown();
}



async function sendChat(){
  let message=document.getElementById("chatInput").value.trim();
  if(message==="") return;

  // 🚨 Validate BEFORE sending
  if(hasSensitiveData(message)){
    showWarning("⚠ Please DO NOT include phone numbers, emails, Aadhaar, PAN, passwords or confidential data.");
    return;
  }

  if(hasInjection(message)){
    showWarning("⚠ Unsafe instruction detected. Rewrite clearly and safely.");
    return;
  }

  clearWarning();

  addMessage(message,"You");
  document.getElementById("chatInput").value="";

  const res = await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:message})
  });

  const result = await res.json();
  addMessage(result.answer,"EVA");
}


document.getElementById("chatInput").addEventListener("input", function(){
  let txt=this.value;

  if(hasSensitiveData(txt)){
    showWarning("⚠ Remove personal data like phone, email, Aadhaar etc.");
  } else if(hasInjection(txt)){
    showWarning("⚠ Unsafe instructional patterns detected.");
  } else {
    clearWarning();
  }
});

document.getElementById("chatInput").addEventListener("keypress", function(e){
  if(e.key === "Enter" && !document.getElementById("sendBtn").disabled){
    sendChat();
  }
});


</script>
