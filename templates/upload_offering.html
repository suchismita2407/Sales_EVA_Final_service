<!DOCTYPE html>
<html>
<head>
<title>Create Offering</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
.card-eva {
  background:#fff;
  padding:20px;
  border-radius:10px;
  border:1px solid #dbe4f0;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark" style="background:#082654;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/offerings">← Offerings</a>
  </div>
</nav>

<div class="container mt-4">
  <div class="card-eva">
    <h5>Create Offering</h5>

    <form id="uploadForm" enctype="multipart/form-data">

      <div class="mb-2">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter offering name" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Industry</label>
        <input type="text" name="industry" placeholder="BFSI, Telecom etc." class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Description</label>
        <textarea name="description" placeholder="Describe offering capabilities..." class="form-control" required></textarea>
      </div>

      <div class="mb-2">
        <label>Upload Collateral (Optional)</label>
        <input type="file" name="file" class="form-control">
      </div>

      <button type="button" onclick="uploadOffering()" class="btn btn-primary w-100 mt-2">
        Create Offering
      </button>

    </form>
  </div>
</div>


<script>

async function uploadOffering() {

   const form = document.getElementById("uploadForm");
   const formData = new FormData(form);

   // 1️⃣ Create offering first
   const offeringRes = await fetch("/api/offerings", {
      method: "POST",
      body: formData
   }).then(res => res.json());

   console.log("Offering API Response:", offeringRes);

   if (!offeringRes.id) {
     alert("Something went wrong in creating offering!");
     return;
   }

   // 2️⃣ Check if user uploaded file
   const file = form.file.files[0];

   if (file) {
       const uploadData = new FormData();
       uploadData.append("file", file);
       uploadData.append("type", "offering");
       uploadData.append("ref_id", offeringRes.id);

       await fetch("/api/upload_document", {
          method: "POST",
          body: uploadData
       });
   }

   alert("Offering Created Successfully!");

   // ➤ Stay on same page
   window.location.href = "/upload_offering"; 
}

</script>
</body>
</html>
