name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Install quality tools
        run: python -m pip install "ruff>=0.8,<1" "pip-audit>=2.7,<3"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest tests -q
      - name: Lint
        run: ruff check app.py config.py db.py services tests
      - name: Audit dependencies
        run: >-
          pip-audit -r requirements.lock
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45833
          --ignore-vuln CVE-2026-45831